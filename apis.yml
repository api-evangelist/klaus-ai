apis:
- aid: klaus-ai:klaus-ai-platform-api
  name: Klaus Platform API
  description: >-
    The Klaus platform API at api.klausai.com is a tRPC RPC surface used by the first-party @klausai/cli
    command-line client to manage OpenClaw instances, agents, integrations, models, and chat sessions, plus an
    OpenAI-compatible chat-completions proxy at /openclaw/v1/chat/completions for sending messages to an agent.
    Requests authenticate with an x-api-key API key created at klausai.com/account, or with a bearer session
    token obtained through the OAuth 2.0 Device Authorization Grant. The active instance is selected with an
    x-klaus-instance-id request header. Klaus publishes no OpenAPI description of this surface; the operations
    catalogued here were read from the provider's own published npm client bundle.
  humanURL: https://klausai.com/faq/
