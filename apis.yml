aid: klaus-ai
name: Klaus AI
description: >-
  Klaus is a managed cloud hosting platform for OpenClaw AI agents, built by Usebits Inc (Y Combinator W26,
  San Francisco) and founded by Bailey Wickham and Robbie Thompson. Klaus provisions an isolated, pre-configured
  OpenClaw instance on dedicated AWS ARM compute in about five minutes, with messaging channels (Slack, Telegram,
  WhatsApp, iMessage, Discord), Google Workspace, browser automation via Chromium and a Chrome Browser Relay
  extension, AgentMail email, GitHub backup, Tailscale SSH, scheduled cron tasks, semantic memory backed by
  OpenRouter embeddings, and instance webhooks that let external services trigger the agent over authenticated
  HTTP. Model access is brokered through OpenRouter with bring-your-own-key and ChatGPT-subscription options.
  The platform is operated through the Klaus web dashboard and a first-party command-line client published to
  npm as @klausai/cli, which talks to a tRPC API at api.klausai.com and proxies an OpenAI-compatible
  chat-completions endpoint. Authentication is by API key or an OAuth 2.0 Device Authorization Grant (RFC 8628).
