key_flows:
- name: Authenticate and pick an instance
  steps:
  - klaus login
  - klaus instance list
  - klaus instance use <instanceId>
- name: Talk to your agent from the terminal
  steps:
  - klaus model list
  - klaus model set <model>
  - klaus chat "<message>"
- name: Provision and operate an instance
  steps:
  - klaus instance create
  - klaus instance status
  - klaus instance exec "<command>"
- name: Review agent history
  steps:
  - klaus session list
  - klaus session show <sessionId>
